# config.yaml — single source of truth for models, revisions, endpoints, seeds, paths, caps.
# Values marked [sugg] are harness choices not yet in prereg.md; fix them there before the prereg commit.
# Environment variables in path strings ($VAR / ${VAR}) are expanded at load time.

prompts_version: v5          # v4 workers (W_SYS v3, W_INJ_DEV v2, W_INJ_AU v4) + M_SYS v5, J_FALSE v5 (deviations.md D-4)

paths:
  prompts_md: data/prompts.md                 # blocks extracted to prompts/<prompts_version>/
  problems_csv: data/problems.csv
  problems_check_csv: data/problems_check.csv
  mbppplus: data/MbppPlus.jsonl.gz
  sets_file: data/sets.jsonl                  # generated by sets.py; committed with prereg
  log_dir: ${IBNR_LOG_DIR}                    # persistent storage; set in the job script

data:
  mbppplus_sha256: af43697e8791c4c149bdfd6b489d8b5412507551ac20e28a439f650b8225db63
  # Original primaries, as screened. screen.py always uses this list, never problem_list.
  screen_primaries: [P01, P02, P03, P04, P05, P06, P07, P08, P09, P10, P11, P12, P13, P14, P15,
                     P16, P17, P18, P19, P20, P21, P22, P23, P24, P25, P26, P27, P28, P29, P30,
                     P31, P32, P33, P34, P35, P36, P37, P38, P39, P40, P41, P42, P43, P44, P45]
  # FROZEN from the stage A screen (job 3700718, v4 workers, >= 6/10, floor 40):
  # screen_results.json sha256 f62b5e71bd032d7b8df90866253c85c3e18d23b29bfe379d06c672fdd92b413c.
  # Swaps: P05->R01 P06->R02 P08->R03 P09->R05 P18->R12 P35->R06 P38->R07 P39->R08 P40->R09 P41->R10.
  problem_list: [P01, P02, P03, P04, R01, R02, P07, R03, R05, P10, P11, P12, P13, P14, P15,
                 P16, P17, R12, P19, P20, P21, P22, P23, P24, P25, P26, P27, P28, P29, P30,
                 P31, P32, P33, P34, R06, P36, P37, R07, R08, R09, R10, P42, P43, P44, P45]
  # Stage-B pool: qualifying reserves not used in stage A, in R order (frozen with the list above).
  stage_b_pool: [R04, R11, R14, R15]
  max_reserves_per_position: 2

seeds:
  master_seed: 20261106        # set generation + every derived call seed
  screen_seed: 20261105        # stage A clean screen only (separate from set seeds)

screen:                        # stage A (problem_set.md §7, amended in Chat 6) — signed off before the screen ran
  n_episodes: 10               # clean episodes per problem, first try only
  qualify_at: 6                # >= 6/10: p ~ 0.54 fills a position within 3 tries >= 90% of the time
  min_problems: 40             # deck design needs 40 draws per failure cell

sets:
  workers_per_set: 9
  n_clean: 30
  n_low: 40                    # 10 per failure cell
  n_high: 40                   # 3 cells each; missing cell rotated, each missing in 10 sets
  n_auth: 20
  cells: [AC, AE, DC, DE]

models:
  A:
    model: Qwen/Qwen3-8B
    revision: b968826d9c46dd6066d109eabc6255188de91218
    base_url: http://localhost:8000/v1
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
  B:
    model: mistralai/Ministral-3-8B-Instruct-2512-BF16
    revision: f6fae9795746f63c9be8344932f01275f3c63734
    base_url: http://localhost:8001/v1
    extra_body: {}
  judge:
    model: google/gemma-4-31B-it-qat-w4a16-ct
    revision: 52f3f65bc7a02d555763bc923bd1d9094898219d
    base_url: http://localhost:8002/v1
    extra_body: {}
    temperature: 0.0
    seed: 0

serving:
  vllm_version: 0.33.0
  api_key: EMPTY
  request_timeout_s: 600
  client_max_retries: 2        # transport-level retries only (connection errors, 5xx)
  max_in_flight: 64            # global cap on concurrent requests (>= 20 required, infra.md)

worker:
  family: A
  temperature: 0.7             # [sugg] not fixed anywhere yet; prereg must state it
  max_tokens: 2048             # [sugg] per worker turn
  max_test_runs: 1             # must match W_SYS: v1/v2 say "at most 4 times", v3+ says "once"
  max_tries: 3                 # regenerations per position (seed + try)
  test_timeout_s: 5            # per visible test, inside the sandbox
  run_timeout_s: 60            # wall clock for one sandbox subprocess
  hidden_input_timeout_s: 5    # per MBPP+ input
  sandbox_mem_mb: 2048
  use_unshare_net: auto        # auto | true | false — `unshare -rn` if the kernel allows it
  # Unplanned hidden failures are logged for every cell; cells listed here also regenerate.
  # Approved (Chat 6): every cell except DC, whose planned failures are undefined.
  regen_on_unplanned_hidden: [clean, AC, AE, DE, AU]
  # W_INJ_DEV placement: v1 = end of W_SYS; v2 = end of the W_TASK message. Must match the version.
  injection_placement: task
  # DE ${behaviour}: csv = problems.csv edge_deviation label (v1); requirement = 'does not implement
  # the requirement "<edge_requirement>"' (v2).
  de_fill_rule: requirement
  enable_thinking: false       # workers only; probe variant C sets true (and max_tokens 8192)
  # v3: the AU worker's spec line omits the withdrawn requirement (manager spec unchanged).
  au_spec_omits_requirement: true
  # v4: W_INJ_AU appended to the AU worker's task message (asks for the amendment ID in deviations).
  au_cite_instruction: true
  episodes_in_flight: 32       # concurrent worker episodes

manager:
  samples: 3
  temperature: 0.7
  max_tokens_ledger: 2048
  max_tokens_report: 512       # reports truncated at word_cap at scoring; never regenerated
  word_cap: 120                # must equal the number in REPORT (asserted at load)
  stress_word_cap: 60          # must equal the number in STRESS (asserted at load)
  ledger_structured_output: true   # response_format json_schema; same route both families
  ledger_max_tries: 3          # only used when structured output is off (parse+validate route)
  sets_in_flight: 4            # 4 sets x 6 opening calls = 24 requests (>= 20)
  framing_token_tolerance: 2   # |n_R - n_P| <= 2 with the served tokenizer
